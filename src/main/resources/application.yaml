# Umumiy sozlamalar. Muhitga xos qiymatlar: application-dev.yaml / application-prod.yaml
spring:
  application:
    name: spring-mcp

  profiles:
    # SPRING_PROFILES_ACTIVE berilmasa lokal ishlab chiqish rejimi
    default: dev

  config:
    # Ishga tushirilgan papkadagi .env (KEY=value). Haqiqiy muhit o'zgaruvchilari undan ustun.
    import: optional:file:.env[.properties]

  datasource:
    url: ${SALESDOCTOR_DB_URL}
    username: ${SALESDOCTOR_DB_USER}
    password: ${SALESDOCTOR_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sana bo'yicha so'rovlar (created_at::date) AppTime.ZONE bilan bir xil kunni bersin
      connection-init-sql: "SET TIME ZONE 'Asia/Tashkent'"

  jooq:
    sql-dialect: postgres

  flyway:
    community-db-support-enabled: true
    enabled: true
    locations: classpath:db/migration
    # Bo'sh bo'lmagan, tarixsiz sxemada V1 ni o'tkazib yubormaslik uchun
    baseline-on-migrate: false
    default-schema: public

  ai:
    mcp:
      server:
        name: salesdoctor-mcp
        version: 1.0.0
        instructions: "SalesDoctor vazifalar va savdo ma'lumotlari uchun MCP server"
        protocol: streamable
        type: sync
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true
        annotation-scanner:
          enabled: true
        request-timeout: 30s
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

server:
  port: ${SERVER_PORT:8888}

salesdoctor:
  security:
    jwt:
      secret: ${SALESDOCTOR_JWT_SECRET:}
      issuer: ${SALESDOCTOR_JWT_ISSUER:salesdoctor-mcp}
  errors:
    # true bo'lsa INTERNAL_ERROR javobida asl xabar ko'rsatiladi (SQL va h.k. sizib chiqishi mumkin)
    expose-internal-details: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
  info:
    java:
      enabled: true
