# Qiymatlar loyiha papkasidagi .env dan olinadi (Docker Compose uni avtomatik o'qiydi).
# .env bo'lmasa yoki o'zgaruvchi berilmasa, ":-" dan keyingi lokal default ishlatiladi.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: salesdoctor-postgres
    environment:
      POSTGRES_DB: ${SALESDOCTOR_DB_NAME:-salesdoctor_db}
      POSTGRES_USER: ${SALESDOCTOR_DB_USER:-salesdoctor}
      POSTGRES_PASSWORD: ${SALESDOCTOR_DB_PASSWORD:-salesdoctor_pass}
    ports:
      - "${SALESDOCTOR_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
